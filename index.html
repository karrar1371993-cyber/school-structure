 .official-student-stats{flex-shrink:0;border:1px solid #333}.official-student-stats h3,.official-box h3{background:#e7e1cd!important;text-align:center;font-size:8pt;margin:0;padding:1mm;border-bottom:1px solid #333;color:#111;flex-shrink:0}

<body>
<header class="app-header"><div class="header-inner"><div class="brand"><div class="brand-icon">🏫</div><div><h1>الهيكل التنظيمي للمدرسة</h1><p>منظومة إدارية وإحصائية — العام الدراسي <span id="yearDisplay">٢٠٢٦ – ٢٠٢٧</span></p></div></div><div class="header-fields"><input id="schoolName" aria-label="اسم المدرسة" placeholder="اسم المدرسة" value="مدرسة مصابيح المعرفة المختلطة"><input id="academicYear" aria-label="العام الدراسي" placeholder="العام الدراسي" value="٢٠٢٦ – ٢٠٢٧"></div></div></header>
<main class="wrap">
<div class="summary" id="summaryCards"></div>
<div class="layout">
<nav class="sidebar no-print" aria-label="أقسام التطبيق">
<button class="nav-btn active" data-view="dashboard"><span class="ico">▦</span>لوحة المعلومات</button>
<button class="nav-btn" data-view="teachers"><span class="ico">👩‍🏫</span>سجل المعلمين</button>
<button class="nav-btn" data-view="students"><span class="ico">🎓</span>إحصائية التلاميذ</button>
<button class="nav-btn" data-view="subjects"><span class="ico">📚</span>الهيئة حسب الاختصاص</button>
<button class="nav-btn" data-view="advisors"><span class="ico">🧑‍🏫</span>مرشدو الصفوف</button>
<button class="nav-btn" data-view="staff"><span class="ico">🗂️</span>موظفو المدرسة</button>
<button class="nav-btn" data-view="reports"><span class="ico">🖨️</span>التقارير والطباعة</button>
<button class="nav-btn" data-view="backup"><span class="ico">💾</span>النسخ الاحتياطي</button>
<div class="side-note">يُحفظ العمل تلقائيًا في هذا المتصفح. صدّر نسخة احتياطية بانتظام، خصوصًا قبل تغيير الجهاز أو المتصفح.</div>
</nav>
<section class="panel" id="mainPanel"><div class="panel-head"><div><h2>مرحبًا بك</h2><p>ملخص الهيكل التنظيمي للمدرسة</p></div></div><div class="panel-body">جارٍ تجهيز البيانات…</div></section>
</div></main>
<div class="modal-backdrop" id="confirmModal"><div class="modal"><h3 id="modalTitle">تأكيد الإجراء</h3><p id="modalText">هل تريد المتابعة؟</p><div class="modal-actions"><button class="btn-danger" id="modalConfirm">تأكيد</button><button class="btn-light" id="modalCancel">إلغاء</button></div></div></div><div class="toast" id="toast"></div><div id="officialPrint"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">
<script>
const STORE='school_structure_app_v1';
const grades=['الصف الأول','الصف الثاني','الصف الثالث','الصف الرابع','الصف الخامس','الصف السادس'];
const subjects=['اللغة العربية','اللغة الإنكليزية','الرياضيات','العلوم','الاجتماعيات','التربية الإسلامية','التربية الرياضية','التربية الفنية','معلم صف','حاسوب','أخرى'];
const emptyData=()=>({teachers:[],students:grades.map(g=>({grade:g,sections:[{name:'أ',boys:0,girls:0}]})),advisors:[],staff:[],leaveStats:{seconded:0,sick:0,birth:0,maternity:0,other:0},schoolName:'مدرسة مصابيح المعرفة المختلطة',academicYear:'٢٠٢٦ – ٢٠٢٧'});
let data=loadData(), currentView='dashboard', editTarget=null, pendingAction=null;
function loadData(){try{const d=JSON.parse(localStorage.getItem(STORE));if(d&&Array.isArray(d.teachers)){const base=emptyData();return {...base,...d,leaveStats:{...base.leaveStats,...(d.leaveStats||{})},students:Array.isArray(d.students)?d.students:base.students,advisors:Array.isArray(d.advisors)?d.advisors:[],staff:Array.isArray(d.staff)?d.staff:[]}}}catch(e){}return emptyData()}
function save(){data.schoolName=document.getElementById('schoolName').value;data.academicYear=document.getElementById('academicYear').value;localStorage.setItem(STORE,JSON.stringify(data));document.getElementById('yearDisplay').textContent=data.academicYear;renderSummary()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function totalStudents(){return data.students.reduce((sum,g)=>sum+g.sections.reduce((s,x)=>s+(+x.boys||0)+(+x.girls||0),0),0)}
function renderSummary(){const cards=[['المعلمون',data.teachers.length,'👩‍🏫'],['التلاميذ',totalStudents(),'🎓'],['مرشدو الصفوف',data.advisors.length,'🧑‍🏫'],['موظفو المدرسة',data.staff.length,'🗂️']];document.getElementById('summaryCards').innerHTML=cards.map(c=>`<div class="stat"><span class="symbol">${c[2]}</span><div class="label">${c[0]}</div><div class="number">${c[1]}</div></div>`).join('')}
function shell(title,desc,body,tools=''){document.getElementById('mainPanel').innerHTML=`<div class="panel-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="toolbar no-print">${tools}</div></div><div class="panel-body">${body}</div>`}
function table(headers,rows,empty='لا توجد بيانات مسجلة حتى الآن'){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${headers.length}">${empty}</td></tr>`}</tbody></table></div>`}
function render(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));renderSummary();({dashboard:renderDashboard,teachers:renderTeachers,students:renderStudents,subjects:renderSubjects,advisors:renderAdvisors,staff:renderStaff,reports:renderReports,backup:renderBackup}[currentView]||renderDashboard)()}
function renderDashboard(){const counts=subjects.map(s=>[s,data.teachers.filter(t=>t.subject===s).length]).filter(x=>x[1]);const gradeRows=data.students.map(g=>{let b=0,gr=0;g.sections.forEach(s=>{b+=+s.boys||0;gr+=+s.girls||0});return `<tr><td>${esc(g.grade)}</td><td>${g.sections.length}</td><td>${b}</td><td>${gr}</td><td><strong>${b+gr}</strong></td></tr>`}).join('');const subRows=counts.map(x=>`<tr><td>${esc(x[0])}</td><td><strong>${x[1]}</strong></td></tr>`).join('');shell('لوحة المعلومات','نظرة عامة على ملاك المدرسة وأعداد التلاميذ',`<div class="notice">ابدأ بإضافة أسماء المعلمين والموظفين، ثم أدخل أعداد التلاميذ في كل صف وشعبة. تُحدّث الإحصائيات تلقائيًا.</div><div class="two-col"><div class="section-block"><h3>إحصائية التلاميذ حسب الصف</h3>${table(['الصف','عدد الشعب','الذكور','الإناث','المجموع'],gradeRows)}</div><div class="section-block"><h3>المعلمون حسب الاختصاص</h3>${table(['الاختصاص','عدد المعلمين'],subRows)}</div></div><div class="chips"><span class="chip">إجمالي المعلمين: <strong>${data.teachers.length}</strong></span><span class="chip">إجمالي التلاميذ: <strong>${totalStudents()}</strong></span><span class="chip">إجمالي الشعب: <strong>${data.students.reduce((s,g)=>s+g.sections.length,0)}</strong></span></div><p class="small-note">اسم المدرسة: ${esc(data.schoolName)} — العام الدراسي: ${esc(data.academicYear)}</p><div class="section-block no-print"><h3>الخلاصة الإدارية والإجازات</h3><p class="small-note">تُحتسب الأعداد الأساسية تلقائيًا، ويمكنك إدخال أعداد التنسيب والإجازات يدويًا.</p><form onsubmit="saveLeaveStats(event)"><div class="form-grid"><div class="field"><label>عدد المنسبين</label><input type="number" min="0" name="seconded" value="${Number(data.leaveStats?.seconded)||0}"></div><div class="field"><label>إجازة مرضية</label><input type="number" min="0" name="sick" value="${Number(data.leaveStats?.sick)||0}"></div><div class="field"><label>إجازة ولادة</label><input type="number" min="0" name="birth" value="${Number(data.leaveStats?.birth)||0}"></div><div class="field"><label>إجازة أمومة</label><input type="number" min="0" name="maternity" value="${Number(data.leaveStats?.maternity)||0}"></div><div class="field"><label>إجازات أخرى</label><input type="number" min="0" name="other" value="${Number(data.leaveStats?.other)||0}"></div></div><button class="btn-primary" type="submit">حفظ بيانات الخلاصة</button></form></div>`,'<button class="btn-primary" onclick="printOfficialForm()">🖨️ طباعة النموذج النهائي A3</button>')}
function saveLeaveStats(e){e.preventDefault();const f=new FormData(e.currentTarget);data.leaveStats={seconded:Number(f.get('seconded'))||0,sick:Number(f.get('sick'))||0,birth:Number(f.get('birth'))||0,maternity:Number(f.get('maternity'))||0,other:Number(f.get('other'))||0};save();renderDashboard();toast('تم حفظ بيانات الخلاصة والإجازات')}
function renderTeachers(){const rows=data.teachers.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td><td>${esc(t.title)}</td><td>${esc(t.subject)}</td><td>${esc(t.qualification)}</td><td>${esc(t.type)}</td><td>${esc(t.notes)}</td><td class="no-print"><div class="actions"><button class="btn-light mini" onclick="editItem('teachers',${i})">تعديل</button><button class="btn-danger mini" onclick="deleteItem('teachers',${i})">حذف</button></div></td></tr>`).join('');shell('سجل المعلمين','إضافة بيانات الملاك التعليمي وتعديلها والبحث فيها',`${teacherForm()}<div class="toolbar no-print" style="margin-bottom:12px"><input class="search" id="teacherSearch" placeholder="ابحث بالاسم أو الاختصاص…" oninput="filterTable(this,'teachersTable')"></div><div id="teachersTable">${table(['ت','اسم المعلم الكامل','العنوان الوظيفي','الاختصاص','المؤهل العلمي','نوع التعيين','ملاحظات','إجراءات'],rows)}</div>`,'<button class="btn-light" onclick="exportCSV(\'teachers\')">تصدير CSV</button><button class="btn-primary" onclick="window.print()">طباعة A3</button>');}
function teacherForm(){return `<form id="teacherForm" onsubmit="submitTeacher(event)"><div class="form-grid"><div class="field"><label>اسم المعلم الكامل *</label><input name="name" required placeholder="الاسم الثلاثي أو الرباعي"></div><div class="field"><label>العنوان الوظيفي</label><input name="title" placeholder="مثال: معلم / معلم جامعي"></div><div class="field"><label>الاختصاص *</label><select name="subject" required>${subjects.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>المؤهل العلمي</label><select name="qualification"><option value="">اختر المؤهل</option>${['دكتوراه','ماجستير','دبلوم عالٍ','بكالوريوس','دبلوم','إعدادية','أخرى'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>نوع التعيين</label><select name="type"><option value="">غير محدد</option>${['ملاك دائم','عقد','محاضر','أجر يومي','أخرى'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>ملاحظات</label><input name="notes" placeholder="اختياري"></div></div><div class="toolbar no-print"><button class="btn-primary" type="submit" id="teacherSubmit">إضافة المعلم</button><button class="btn-light" type="reset" onclick="cancelEdit()">تفريغ الحقول</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:18px 0">`}
function submitTeacher(e){e.preventDefault();const f=e.target,fd=new FormData(f),item=Object.fromEntries(fd.entries());if(editTarget&&editTarget.kind==='teachers'){data.teachers[editTarget.index]=item;editTarget=null;toast('تم تحديث بيانات المعلم')}else{data.teachers.push(item);toast('تمت إضافة المعلم بنجاح')}save();renderTeachers()}
function renderStudents(){let html='';data.students.forEach((g,gi)=>{const rows=g.sections.map((s,si)=>`<tr><td>${esc(g.grade)}</td><td><input aria-label="اسم الشعبة" value="${esc(s.name)}" style="width:65px" onchange="updateSection(${gi},${si},'name',this.value)"></td><td><input type="number" min="0" value="${+s.boys||0}" style="width:85px" onchange="updateSection(${gi},${si},'boys',this.value)"></td><td><input type="number" min="0" value="${+s.girls||0}" style="width:85px" onchange="updateSection(${gi},${si},'girls',this.value)"></td><td><strong>${(+s.boys||0)+(+s.girls||0)}</strong></td><td class="no-print"><button class="btn-danger mini" onclick="removeSection(${gi},${si})">حذف الشعبة</button></td></tr>`).join('');html+=`<div class="section-block"><h3>${g.grade}</h3>${table(['الصف','الشعبة','عدد الذكور','عدد الإناث','المجموع','إجراء'],rows)}<div class="toolbar no-print" style="margin-top:8px"><button class="btn-light mini" onclick="addSection(${gi})">＋ إضافة شعبة</button><span class="chip">مجموع الصف: <strong>${g.sections.reduce((s,x)=>s+(+x.boys||0)+(+x.girls||0),0)}</strong></span></div></div>`});shell('إحصائية التلاميذ','إدخال أعداد الذكور والإناث في الصفوف من الأول إلى السادس',`<div class="notice">أدخل الأعداد فقط؛ تُحسب المجاميع تلقائيًا. يمكن إضافة أكثر من شعبة لكل صف.</div>${html}<div class="chips"><span class="chip">المجموع الكلي للتلاميذ: <strong>${totalStudents()}</strong></span></div>`,'<button class="btn-primary" onclick="window.print()">🖨️ طباعة إحصائية A3</button><button class="btn-light" onclick="exportCSV(\'students\')">تصدير CSV</button>')}
function updateSection(gi,si,key,val){data.students[gi].sections[si][key]=key==='name'?val:Math.max(0,parseInt(val||0,10));save();renderStudents()}
function addSection(gi){const g=data.students[gi],letters=['أ','ب','ج','د','هـ','و','ز'];g.sections.push({name:letters[g.sections.length]||`شعبة ${g.sections.length+1}`,boys:0,girls:0});save();renderStudents()}
function removeSection(gi,si){if(data.students[gi].sections.length===1){toast('يجب إبقاء شعبة واحدة على الأقل لكل صف');return}data.students[gi].sections.splice(si,1);save();renderStudents()}
function renderSubjects(){const rows=subjects.map(s=>{const list=data.teachers.filter(t=>t.subject===s);return list.length?`<tr><td>${esc(s)}</td><td>${list.length}</td><td>${esc(list.map(t=>t.name).join('، '))}</td></tr>`:''}).filter(Boolean).join('');shell('الهيئة التعليمية حسب الاختصاص','ملخص تلقائي مستخرج من سجل المعلمين',`${table(['الاختصاص','عدد المعلمين','أسماء المعلمين'],rows,'لا توجد أسماء في سجل المعلمين بعد. أضف المعلمين من قسم سجل المعلمين.') }<p class="small-note">تظهر الاختصاصات التي يوجد لها معلم واحد على الأقل. أضف أي اختصاص غير موجود من خلال اختيار «أخرى» في سجل المعلمين وكتابة التفاصيل في الملاحظات.</p>`,'<button class="btn-primary" onclick="window.print()">طباعة A3</button><button class="btn-light" onclick="exportCSV(\'subjects\')">تصدير CSV</button>')}
function simpleForm(kind,labels){const fields=labels.map(([key,label,opts])=>`<div class="field"><label>${label}${key==='name'?' *':''}</label>${opts?`<select name="${key}">${opts.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${key}" ${key==='name'?'required':''} placeholder="${label}">`}</div>`).join('');return `<form onsubmit="submitSimple(event,'${kind}')"><div class="form-grid">${fields}</div><div class="toolbar no-print"><button class="btn-primary" type="submit">إضافة</button><button class="btn-light" type="reset">تفريغ الحقول</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:18px 0">`}
function submitSimple(e,kind){e.preventDefault();const item=Object.fromEntries(new FormData(e.target).entries());if(!item.name?.trim()){toast('يرجى إدخال الاسم');return}if(editTarget&&editTarget.kind===kind){data[kind][editTarget.index]=item;editTarget=null;toast('تم تحديث البيانات')}else{data[kind].push(item);toast('تمت الإضافة بنجاح')}save();kind==='advisors'?renderAdvisors():renderStaff()}
function renderAdvisors(){const form=simpleForm('advisors',[['name','اسم المرشد الصفي'],['grade','الصف',grades],['section','الشعبة',['أ','ب','ج','د','هـ']],['subject','الاختصاص',subjects],['count','عدد التلاميذ'],['notes','ملاحظات']]);const rows=data.advisors.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.name)}</td><td>${esc(a.grade)}</td><td>${esc(a.section)}</td><td>${esc(a.subject)}</td><td>${esc(a.count)}</td><td>${esc(a.notes)}</td><td class="no-print"><div class="actions"><button class="btn-light mini" onclick="editItem('advisors',${i})">تعديل</button><button class="btn-danger mini" onclick="deleteItem('advisors',${i})">حذف</button></div></td></tr>`).join('');shell('مرشدو الصفوف','توزيع المرشدين على الصفوف والشعب',`${form}${table(['ت','اسم المرشد','الصف','الشعبة','الاختصاص','عدد التلاميذ','ملاحظات','إجراءات'],rows)}`,'<button class="btn-primary" onclick="window.print()">طباعة A3</button><button class="btn-light" onclick="exportCSV(\'advisors\')">تصدير CSV</button>')}
function renderStaff(){const form=simpleForm('staff',[['name','اسم الموظف'],['title','العنوان الوظيفي'],['unit','الوحدة / المهام'],['type','نوع الدوام',['صباحي','مسائي','مناوب','أخرى']],['notes','ملاحظات']]);const rows=data.staff.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.name)}</td><td>${esc(a.title)}</td><td>${esc(a.unit)}</td><td>${esc(a.type)}</td><td>${esc(a.notes)}</td><td class="no-print"><div class="actions"><button class="btn-light mini" onclick="editItem('staff',${i})">تعديل</button><button class="btn-danger mini" onclick="deleteItem('staff',${i})">حذف</button></div></td></tr>`).join('');shell('موظفو المدرسة','تسجيل الموظفين الإداريين والخدميين وبقية الكوادر',`${form}${table(['ت','اسم الموظف','العنوان الوظيفي','الوحدة / المهام','نوع الدوام','ملاحظات','إجراءات'],rows)}`,'<button class="btn-primary" onclick="window.print()">طباعة A3</button><button class="btn-light" onclick="exportCSV(\'staff\')">تصدير CSV</button>')}
function renderReports(){const gradeRows=data.students.map(g=>{let b=0,gr=0;g.sections.forEach(s=>{b+=+s.boys||0;gr+=+s.girls||0});return `<tr><td>${esc(g.grade)}</td><td>${g.sections.length}</td><td>${b}</td><td>${gr}</td><td>${b+gr}</td></tr>`}).join('');const teacherRows=data.teachers.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td><td>${esc(t.title)}</td><td>${esc(t.subject)}</td><td>${esc(t.qualification)}</td></tr>`).join('');const advisorRows=data.advisors.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.name)}</td><td>${esc(a.grade)}</td><td>${esc(a.section)}</td><td>${esc(a.subject)}</td></tr>`).join('');const staffRows=data.staff.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.name)}</td><td>${esc(a.title)}</td><td>${esc(a.unit)}</td></tr>`).join('');shell('التقارير والطباعة','تقارير مهيأة للطباعة على ورق A3 بالاتجاه الأفقي',`<div class="notice no-print">اختر التقرير الذي تريد طباعته. من نافذة الطباعة اختر حجم الورق A3 والاتجاه أفقي (Landscape). يمكن اختيار «حفظ بصيغة PDF» من الطابعة.</div><div class="toolbar no-print" style="margin-bottom:18px"><button class="btn-primary" onclick="printOfficialForm()">طباعة النموذج النهائي A3</button><button class="btn-light" onclick="printReport('all')">طباعة التقرير التفصيلي</button><button class="btn-light" onclick="printReport('teachers')">سجل المعلمين</button><button class="btn-light" onclick="printReport('students')">إحصائية التلاميذ</button><button class="btn-light" onclick="printReport('advisors')">مرشدو الصفوف</button><button class="btn-light" onclick="printReport('staff')">موظفو المدرسة</button><button class="btn-teal" onclick="exportAllCSV()">تصدير كل البيانات CSV</button></div><div id="printReportArea"><div class="report-title"><h2>${esc(data.schoolName)}</h2><p>الهيكل التنظيمي والإحصائي للمدرسة — العام الدراسي ${esc(data.academicYear)}</p></div><div class="section-block"><h3>إحصائية التلاميذ</h3>${table(['الصف','عدد الشعب','الذكور','الإناث','المجموع'],gradeRows)}<p><strong>المجموع الكلي: ${totalStudents()} تلميذًا</strong></p></div><div class="section-block"><h3>سجل المعلمين</h3>${table(['ت','اسم المعلم','العنوان الوظيفي','الاختصاص','المؤهل العلمي'],teacherRows)}</div><div class="section-block"><h3>مرشدو الصفوف</h3>${table(['ت','اسم المرشد','الصف','الشعبة','الاختصاص'],advisorRows)}</div><div class="section-block"><h3>موظفو المدرسة</h3>${table(['ت','اسم الموظف','العنوان الوظيفي','الوحدة / المهام'],staffRows)}</div></div>`)}

    <section class="official-box official-staff"><h3>الموظفون</h3>${makeTable(['ت','الاسم الثلاثي','العنوان الوظيفي','المهام'],Array.from({length:Math.max(5,data.staff.length)},(_,i)=>{const a=data.staff[i];return row([i+1,a?.name||'',a?.title||'',a?.unit||''])}),true)}</section>
   </div>
   <div class="official-summary-grid"><div class="summary-title">الخلاصة</div><div><div class="sum-label">عدد التلاميذ الكلي</div><div class="sum-value">${totalBoys+totalGirls}</div></div><div><div class="sum-label">عدد الشعب</div><div class="sum-value">${data.students.reduce((n,g)=>n+g.sections.length,0)}</div></div><div><div class="sum-label">عدد المعلمين</div><div class="sum-value">${data.teachers.length}</div></div><div><div class="sum-label">عدد الموظفين</div><div class="sum-value">${data.staff.length}</div></div><div><div class="sum-label">عدد الصفوف</div><div class="sum-value">${data.students.length}</div></div><div><div class="sum-label">عدد المنسبين</div><div class="sum-value">${Number(data.leaveStats?.seconded)||0}</div></div><div><div class="sum-label">إجازة مرضية</div><div class="sum-value">${Number(data.leaveStats?.sick)||0}</div></div><div><div class="sum-label">إجازة ولادة</div><div class="sum-value">${Number(data.leaveStats?.birth)||0}</div></div><div><div class="sum-label">إجازة أمومة</div><div class="sum-value">${Number(data.leaveStats?.maternity)||0}</div></div><div><div class="sum-label">إجازات أخرى</div><div class="sum-value">${Number(data.leaveStats?.other)||0}</div></div></div>
   <div class="official-principal">مدير المدرسة / سعود محسن أحمد</div>
  </div>
  <section class="official-box official-teachers-side"><h3>سجل المعلمين</h3>${makeTable(['ت','اسم المعلم الثلاثي','العنوان الوظيفي','الاختصاص','الملاحظات'],Array.from({length:Math.max(41,data.teachers.length)},(_,i)=>{const t=data.teachers[i];return row([i+1,t?.name||'',t?.title||'',t?.subject||'',t?.notes||''])}),true)}</section>
 </div>
</div>`;
 document.body.classList.add('official-print-mode');window.print();setTimeout(()=>document.body.classList.remove('official-print-mode'),500);
}
function printReport(which){const area=document.getElementById('printReportArea');if(which==='all'){window.print();return}const original=area.innerHTML;const blocks=[...area.querySelectorAll('.section-block')];const target=which==='teachers'?1:which==='students'?0:which==='advisors'?2:3;area.innerHTML=`<div class="report-title"><h2>${esc(data.schoolName)}</h2><p>${esc(data.academicYear)}</p></div>${blocks[target].outerHTML}`;window.print();area.innerHTML=original}
function renderBackup(){shell('النسخ الاحتياطي واستعادة البيانات','حافظ على بيانات المدرسة في ملف خارجي آمن',`<div class="notice">الحفظ المحلي لا ينقل بياناتك تلقائيًا إلى جهاز آخر. استخدم تصدير النسخة الاحتياطية لنقل البيانات أو الاحتفاظ بنسخة منها.</div><div class="section-block"><h3>تصدير نسخة احتياطية كاملة</h3><p class="small-note">يتضمن الملف اسم المدرسة والعام الدراسي وجميع سجلات المعلمين والتلاميذ والمرشدين والموظفين.</p><button class="btn-primary" onclick="exportBackup()">⬇️ تنزيل نسخة احتياطية JSON</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="section-block"><h3>استعادة نسخة احتياطية</h3><p class="small-note">اختر ملف JSON سبق تصديره من هذا التطبيق. ستُستبدل البيانات الحالية بالبيانات الموجودة في الملف.</p><button class="btn-teal" onclick="document.getElementById('importFile').click()">⬆️ اختيار ملف للاستعادة</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="section-block"><h3>مسح بيانات التطبيق</h3><p class="small-note">هذا الإجراء يحذف السجلات المحفوظة في هذا المتصفح. صدّر نسخة احتياطية أولًا إذا كنت تحتاج إلى الاحتفاظ بها.</p><button class="btn-danger" onclick="confirmAction('clear','مسح جميع البيانات؟','سيتم حذف جميع سجلات التطبيق من هذا المتصفح. لا يمكن التراجع عن هذا الإجراء.')">مسح جميع البيانات</button></div>`)}
function editItem(kind,index){const item=data[kind][index];editTarget={kind,index};render();setTimeout(()=>{const form=document.querySelector('#mainPanel form');if(!form){return}Object.entries(item).forEach(([k,v])=>{const el=form.elements[k];if(el)el.value=v});const submit=form.querySelector('button[type="submit"]');if(submit)submit.textContent='حفظ التعديلات';form.scrollIntoView({behavior:'smooth',block:'start'});toast('عدّل الحقول ثم اضغط حفظ التعديلات')},30)}
function cancelEdit(){editTarget=null}
function deleteItem(kind,index){confirmAction('delete', 'حذف السجل؟','هل تريد حذف هذا السجل؟ لا يمكن التراجع عن الحذف.',()=>{data[kind].splice(index,1);save();render();toast('تم حذف السجل')})}
function confirmAction(action,title,msg,callback){pendingAction=callback||(()=>{if(action==='clear'){data=emptyData();document.getElementById('schoolName').value=data.schoolName;document.getElementById('academicYear').value=data.academicYear;save();render();toast('تم مسح البيانات')}});document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=msg;document.getElementById('confirmModal').classList.add('open')}
document.getElementById('modalConfirm').addEventListener('click',()=>{document.getElementById('confirmModal').classList.remove('open');if(pendingAction)pendingAction();pendingAction=null});document.getElementById('modalCancel').addEventListener('click',()=>{document.getElementById('confirmModal').classList.remove('open');pendingAction=null});
function filterTable(input,id){const q=input.value.toLowerCase();document.querySelectorAll(`#${id} tbody tr`).forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function download(name,content,type){const blob=new Blob(['\ufeff',content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(kind){let rows=[],name=kind+'.csv';if(kind==='teachers'){rows=[['الاسم','العنوان الوظيفي','الاختصاص','المؤهل العلمي','نوع التعيين','ملاحظات'],...data.teachers.map(t=>[t.name,t.title,t.subject,t.qualification,t.type,t.notes])]}else if(kind==='students'){rows=[['الصف','الشعبة','الذكور','الإناث','المجموع'],...data.students.flatMap(g=>g.sections.map(s=>[g.grade,s.name,s.boys,s.girls,(+s.boys||0)+(+s.girls||0)]))]}else if(kind==='subjects'){rows=[['الاختصاص','عدد المعلمين','الأسماء'],...subjects.map(s=>{const ts=data.teachers.filter(t=>t.subject===s);return[s,ts.length,ts.map(t=>t.name).join('، ')]})]}else if(kind==='advisors'){rows=[['اسم المرشد','الصف','الشعبة','الاختصاص','عدد التلاميذ','ملاحظات'],...data.advisors.map(a=>[a.name,a.grade,a.section,a.subject,a.count,a.notes])]}else if(kind==='staff'){rows=[['اسم الموظف','العنوان الوظيفي','الوحدة / المهام','نوع الدوام','ملاحظات'],...data.staff.map(a=>[a.name,a.title,a.unit,a.type,a.notes])]};download(name,rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8;');toast('تم تنزيل ملف CSV ويمكن فتحه ببرنامج Excel')}
function exportAllCSV(){['teachers','students','advisors','staff'].forEach(k=>exportCSV(k))}
function exportBackup(){download('نسخة_احتياطية_الهيكل_المدرسي.json',JSON.stringify(data,null,2),'application/json');toast('تم تنزيل النسخة الاحتياطية')}
document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.teachers)||!Array.isArray(d.students))throw new Error();confirmAction('restore','استعادة النسخة الاحتياطية؟','ستُستبدل البيانات الحالية بالبيانات الموجودة في الملف.',()=>{data={...emptyData(),...d};document.getElementById('schoolName').value=data.schoolName||'';document.getElementById('academicYear').value=data.academicYear||'';save();render();toast('تمت استعادة البيانات بنجاح')})}catch(err){toast('تعذر قراءة الملف. تأكد أنه نسخة JSON صحيحة من التطبيق.')}e.target.value=''};reader.readAsText(file)});
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{currentView=b.dataset.view;editTarget=null;render()}));document.getElementById('schoolName').addEventListener('input',save);document.getElementById('academicYear').addEventListener('input',save);
document.getElementById('schoolName').value=data.schoolName;document.getElementById('academicYear').value=data.academicYear;render();
</script></body></html>
